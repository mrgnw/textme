<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>textme — identity directions</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600&family=Sora:wght@300..800&display=swap"
			rel="stylesheet"
		/>
		<style>
			/* ---------- deck shell ---------- */
			:root {
				--shell-bg: #e9e8e4;
				--shell-ink: #1f1f1d;
				--shell-muted: #6d6c67;
				--shell-line: #d5d3cc;
				--ease-out: cubic-bezier(0.16, 1, 0.3, 1);
				--spring: cubic-bezier(0.34, 1.56, 0.64, 1);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--shell-bg);
				color: var(--shell-ink);
				font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
			}
			.wrap {
				padding: 20px 24px 64px;
			}
			header.deck {
				display: flex;
				flex-wrap: wrap;
				gap: 12px 28px;
				align-items: center;
				margin-bottom: 18px;
			}
			.deck h1 {
				font-size: 15px;
				font-weight: 600;
				margin: 0;
				letter-spacing: -0.01em;
			}
			.thesis {
				color: var(--shell-muted);
				max-width: 62ch;
				margin: 0;
			}
			.controls {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				align-items: center;
				width: 100%;
			}
			.seg {
				display: inline-flex;
				gap: 2px;
				padding: 3px;
				background: #fff;
				border: 1px solid var(--shell-line);
				border-radius: 999px;
			}
			.seg button {
				border: 0;
				background: transparent;
				border-radius: 999px;
				padding: 6px 13px;
				font: inherit;
				font-weight: 500;
				color: var(--shell-muted);
				cursor: pointer;
			}
			.seg button[aria-pressed='true'] {
				background: var(--shell-ink);
				color: #fff;
			}
			.kbd {
				color: var(--shell-muted);
				font-size: 12px;
			}
			.kbd kbd {
				font: inherit;
				border: 1px solid var(--shell-line);
				border-bottom-width: 2px;
				border-radius: 5px;
				padding: 0 5px;
				background: #fff;
			}
			#note {
				width: 100%;
				margin: 0;
				color: var(--shell-ink);
				max-width: 78ch;
			}
			#note b {
				font-weight: 600;
			}

			.stage {
				display: flex;
				gap: 32px;
				align-items: flex-start;
				flex-wrap: wrap;
			}
			.lane[hidden] {
				display: none;
			}
			.lane.phone {
				flex: none;
				width: 412px;
			}
			.bezel {
				width: 412px;
				height: 866px;
				border: 11px solid #17171a;
				border-radius: 50px;
				background: #000;
				overflow: hidden;
				box-shadow:
					0 2px 6px rgba(0, 0, 0, 0.18),
					0 30px 60px -30px rgba(0, 0, 0, 0.45);
			}
			.screen {
				position: relative;
				width: 390px;
				height: 844px;
				overflow: hidden;
				background: var(--bg);
				font-size: 16px;
				line-height: 1.4;
				-webkit-font-smoothing: antialiased;
			}
			.lane.desk {
				flex: 1 1 760px;
				max-width: 1024px;
				min-width: 0;
			}
			.win {
				width: 1024px;
				max-width: 100%;
				border-radius: 12px;
				overflow: hidden;
				border: 1px solid var(--shell-line);
				background: #fff;
				box-shadow:
					0 2px 6px rgba(0, 0, 0, 0.06),
					0 24px 48px -24px rgba(0, 0, 0, 0.25);
			}
			.win-bar {
				height: 38px;
				display: flex;
				align-items: center;
				gap: 7px;
				padding: 0 14px;
				background: #f3f2ef;
				border-bottom: 1px solid var(--shell-line);
			}
			.win-bar i {
				width: 12px;
				height: 12px;
				border-radius: 50%;
				background: #d6d4cd;
			}
			.win-url {
				margin-left: 10px;
				flex: 1;
				max-width: 420px;
				height: 24px;
				border-radius: 7px;
				background: #fff;
				border: 1px solid var(--shell-line);
				font-size: 12px;
				color: #6d6c67;
				display: flex;
				align-items: center;
				padding: 0 10px;
				font-family: ui-monospace, Menlo, monospace;
			}
			.screen.desk {
				width: 100%;
				height: 760px;
			}

			/* phone chrome */
			.statusbar {
				position: absolute;
				inset: 0 0 auto 0;
				height: 48px;
				display: flex;
				justify-content: space-between;
				align-items: flex-end;
				padding: 0 30px 9px;
				font: 600 15px/1 -apple-system, system-ui, sans-serif;
				color: var(--ink);
				z-index: 6;
				pointer-events: none;
			}
			.statusbar .cell {
				display: flex;
				gap: 5px;
				align-items: center;
			}
			.statusbar .bat {
				width: 26px;
				height: 12px;
				border: 1.5px solid currentColor;
				border-radius: 4px;
				padding: 1.5px;
				opacity: 0.9;
			}
			.statusbar .bat i {
				display: block;
				height: 100%;
				width: 78%;
				background: currentColor;
				border-radius: 1.5px;
			}
			.island {
				position: absolute;
				top: 11px;
				left: 50%;
				width: 122px;
				height: 35px;
				transform: translateX(-50%);
				background: #000;
				border-radius: 20px;
				z-index: 7;
			}
			.homebar {
				position: absolute;
				bottom: 8px;
				left: 50%;
				width: 134px;
				height: 5px;
				border-radius: 3px;
				background: var(--ink);
				transform: translateX(-50%);
				z-index: 7;
				opacity: 0.85;
			}

			/* ---------- app floor (all directions) ---------- */
			.app {
				position: absolute;
				inset: 0;
				overflow: hidden;
				display: flex;
				flex-direction: column;
				background: var(--bg);
				color: var(--ink);
			}
			.screen.phone .app {
				padding-top: 52px;
				padding-bottom: 26px;
			}
			.app button,
			.app input,
			.app textarea {
				font: inherit;
				color: inherit;
				cursor: pointer;
			}
			.app :focus-visible {
				outline: none;
				box-shadow:
					0 0 0 2px var(--bg),
					0 0 0 4px var(--accent);
			}
			.app a {
				color: inherit;
				text-decoration: none;
			}
			.ico {
				width: 18px;
				height: 18px;
				flex: none;
				fill: none;
				stroke: currentColor;
				stroke-width: 2;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			.brand {
				width: 20px;
				height: 20px;
				flex: none;
				fill: currentColor;
			}
			.app > * {
				animation: rise 0.45s var(--ease-out) both;
			}
			.app > :nth-child(2) {
				animation-delay: 50ms;
			}
			.app > :nth-child(3) {
				animation-delay: 100ms;
			}
			.app > :nth-child(4) {
				animation-delay: 150ms;
			}
			.app > :nth-child(5) {
				animation-delay: 200ms;
			}
			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
			@keyframes blink {
				50% {
					opacity: 0;
				}
			}
			@keyframes pop {
				from {
					opacity: 0;
					transform: translateY(14px) scale(0.92);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation: none !important;
					transition: none !important;
				}
			}

			/* ============ A · Dialpad ============ */
			.screen[data-dir='a'] {
				--bg: #fafaf9;
				--surface: #ffffff;
				--ink: #111111;
				--muted: #6f6f6a;
				--line: #e6e6e2;
				--accent: #f04e23;
				--tg: #1a84c7;
				--wa: #128c7e;
				--sms: #22964f;
				font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif;
			}
			.a {
				padding-inline: 22px;
			}
			.screen.desk .a {
				width: 600px;
				margin: 0 auto;
				padding: 28px 20px 32px;
			}
			.a-top {
				display: flex;
				align-items: center;
				justify-content: space-between;
				height: 44px;
			}
			.a-brand {
				font-weight: 600;
				font-size: 15px;
				font-stretch: 118%;
				letter-spacing: 0.02em;
			}
			.a-brand i {
				font-style: normal;
				color: var(--accent);
			}
			.a-hero {
				padding-top: 26px;
			}
			.a-cc {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				height: 32px;
				padding: 0 10px;
				border-radius: 8px;
				border: 1px solid var(--line);
				background: var(--surface);
				font-size: 13px;
				font-weight: 500;
				letter-spacing: 0.06em;
				color: var(--muted);
			}
			.a-cc em {
				font-style: normal;
				font-weight: 400;
				letter-spacing: 0;
				color: var(--muted);
				opacity: 0.8;
			}
			.a-numline {
				display: flex;
				align-items: center;
				gap: 14px;
				margin-top: 12px;
				padding-bottom: 10px;
				border-bottom: 2px solid var(--ink);
			}
			.a-num {
				flex: 1;
				min-width: 0;
				font-size: 40px;
				font-weight: 600;
				font-stretch: 112%;
				letter-spacing: -0.02em;
				line-height: 1.05;
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}
			.a-num.sm {
				font-size: 34px;
			}
			.screen.desk .a-num {
				font-size: 56px;
			}
			.screen.desk .a-num.sm {
				font-size: 44px;
			}
			.a-num .ph {
				opacity: 0.16;
			}
			.a-caret {
				display: inline-block;
				width: 4px;
				height: 0.86em;
				margin-right: 3px;
				background: var(--accent);
				vertical-align: -0.08em;
				border-radius: 1px;
				animation: blink 1.1s steps(2) infinite;
			}
			.a-key {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				height: 48px;
				padding: 0 16px;
				border-radius: 12px;
				border: 1px solid var(--line);
				background: var(--surface);
				box-shadow: 0 2px 0 var(--line);
				font-weight: 500;
				font-size: 15px;
				flex: none;
				transition: transform 0.12s;
			}
			.a-key:active {
				transform: translateY(2px);
				box-shadow: none;
			}
			.a-iconbtn {
				width: 44px;
				height: 44px;
				border-radius: 10px;
				border: 0;
				background: transparent;
				color: var(--muted);
				display: grid;
				place-items: center;
				flex: none;
			}
			.a-iconbtn:hover {
				background: var(--surface);
				color: var(--ink);
			}
			.a-iconbtn .ico {
				width: 22px;
				height: 22px;
			}
			.a-name {
				font-size: 30px;
				font-weight: 600;
				letter-spacing: -0.02em;
				line-height: 1;
				margin-bottom: 14px;
			}
			.a-rows {
				margin-top: 24px;
				border-top: 1px solid var(--line);
			}
			.a-rows.ghost {
				opacity: 0.35;
			}
			.a-row {
				display: flex;
				align-items: center;
				gap: 14px;
				height: 58px;
				border-bottom: 1px solid var(--line);
				font-size: 17px;
				font-weight: 500;
				transition: padding-left 0.15s var(--ease-out);
			}
			.a-row:hover {
				padding-left: 4px;
			}
			.a-row .brand {
				width: 24px;
				height: 24px;
			}
			.a-row .ico {
				margin-left: auto;
				color: var(--muted);
			}
			.a-row.tg .brand {
				color: var(--tg);
			}
			.a-row.wa .brand {
				color: var(--wa);
			}
			.a-row.sms .brand {
				color: var(--sms);
			}
			.a-sec {
				display: flex;
				gap: 8px;
				margin-top: 16px;
			}
			.a-sec button {
				flex: 1;
				height: 44px;
				border-radius: 10px;
				border: 1px solid var(--line);
				background: var(--surface);
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 7px;
				font-size: 14px;
				font-weight: 500;
				white-space: nowrap;
				padding: 0 8px;
			}
			.a-sec button:hover {
				border-color: var(--ink);
			}
			.a-recent {
				margin-top: 30px;
			}
			.a-label {
				font-size: 12px;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--muted);
				font-weight: 500;
				margin-bottom: 4px;
			}
			.a-rrow {
				display: flex;
				align-items: center;
				gap: 10px;
				height: 48px;
				border-bottom: 1px solid var(--line);
				font-size: 15px;
			}
			.a-rrow .n {
				font-stretch: 110%;
				font-weight: 500;
				font-variant-numeric: tabular-nums;
			}
			.a-rrow .who,
			.a-rrow .when {
				color: var(--muted);
			}
			.a-rrow .when {
				margin-left: auto;
				font-size: 13px;
			}
			.a-rrow .x {
				width: 36px;
				height: 36px;
				border: 0;
				background: transparent;
				color: var(--muted);
				display: grid;
				place-items: center;
				border-radius: 8px;
				margin-right: -8px;
			}
			.a-rrow .x .ico {
				width: 15px;
				height: 15px;
			}
			.a-paste {
				margin: 12px 0 0;
				border: 1px solid var(--line);
				background: var(--surface);
				border-radius: 12px;
				padding: 12px 14px;
				font: 13px/1.55 ui-monospace, Menlo, monospace;
				white-space: pre;
				color: var(--ink);
				max-height: 132px;
				overflow: hidden;
				-webkit-mask-image: linear-gradient(#000 72%, transparent);
				mask-image: linear-gradient(#000 72%, transparent);
			}
			.a-lhead {
				display: flex;
				align-items: baseline;
				gap: 10px;
				margin-top: 18px;
			}
			.a-count {
				font-weight: 600;
				font-size: 17px;
				font-stretch: 108%;
			}
			.a-note {
				color: var(--muted);
				font-size: 13px;
			}
			.a-lbtns {
				display: flex;
				gap: 8px;
				margin-top: 10px;
			}
			.a-btn {
				height: 40px;
				padding: 0 14px;
				border-radius: 10px;
				border: 1px solid var(--line);
				background: var(--surface);
				font-size: 14px;
				font-weight: 500;
				display: inline-flex;
				align-items: center;
				gap: 7px;
				white-space: nowrap;
			}
			.a-btn.primary {
				background: var(--ink);
				border-color: var(--ink);
				color: #fff;
			}
			.a-btn.ghost {
				border-color: transparent;
				color: var(--muted);
				margin-left: auto;
			}
			.a-crows {
				margin-top: 12px;
				border-top: 1px solid var(--line);
			}
			.a-crow {
				display: flex;
				align-items: center;
				gap: 10px;
				height: 62px;
				border-bottom: 1px solid var(--line);
			}
			.a-crow .who {
				flex: 1;
				min-width: 0;
			}
			.a-crow .who b {
				display: block;
				font-size: 16px;
				font-weight: 600;
				line-height: 1.2;
			}
			.a-crow .who .n {
				font-size: 14px;
				color: var(--muted);
				font-stretch: 108%;
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}
			.a-crow .tag {
				font-style: normal;
				font-size: 11px;
				color: var(--accent);
				border: 1px solid currentColor;
				border-radius: 4px;
				padding: 0 4px;
				margin-left: 6px;
				font-stretch: 100%;
				letter-spacing: 0.02em;
			}
			.a-crow .acts {
				display: flex;
				gap: 0;
				margin-right: -6px;
			}
			.a-crow .acts button {
				width: 36px;
				height: 40px;
				border: 0;
				background: transparent;
				color: var(--muted);
				display: grid;
				place-items: center;
				border-radius: 8px;
			}
			.a-crow .acts button:hover {
				background: var(--surface);
				color: var(--ink);
			}
			.a-crow .acts .brand {
				width: 18px;
				height: 18px;
			}
			.a-crow .acts .tg {
				color: var(--tg);
			}
			.a-crow .acts .wa {
				color: var(--wa);
			}
			.a-crow .acts .sms {
				color: var(--sms);
			}
			.a-foot {
				margin-top: auto;
				padding-top: 16px;
				text-align: center;
				font-size: 13px;
				color: var(--muted);
			}
			.a-foot a {
				color: var(--ink);
				text-decoration: underline;
				text-underline-offset: 3px;
			}

			/* ============ B · Card ============ */
			.screen[data-dir='b'] {
				--bg: #edf0f5;
				--surface: #ffffff;
				--ink: #151a21;
				--muted: #5f6b7a;
				--line: #dce1e8;
				--accent: #5b5bd6;
				--tg: #1a84c7;
				--wa: #128c7e;
				--sms: #22964f;
				font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
			}
			.b {
				padding-inline: 16px;
			}
			.b-display {
				font-family: 'Bricolage Grotesque', 'Hanken Grotesk', ui-sans-serif, sans-serif;
				font-optical-sizing: auto;
			}
			.b-top {
				height: 44px;
				display: flex;
				align-items: center;
				justify-content: center;
				flex: none;
			}
			.b-brand {
				font-weight: 700;
				font-size: 17px;
				letter-spacing: -0.02em;
			}
			.b-brand i {
				font-style: normal;
				color: var(--accent);
			}
			.b-scene {
				flex: 1;
				display: flex;
				flex-direction: column;
				justify-content: center;
				gap: 14px;
				padding: 8px 0 12px;
				min-height: 0;
			}
			.b.is-list .b-scene {
				justify-content: flex-start;
				gap: 10px;
			}
			.screen.desk .b-scene {
				width: 100%;
				max-width: 440px;
				margin: 0 auto;
			}
			.screen.desk .b.is-list .b-scene {
				max-width: 560px;
				padding-top: 20px;
			}
			.b-card {
				position: relative;
				isolation: isolate;
				background: var(--surface);
				border-radius: 22px;
				padding: 22px 22px 18px;
				box-shadow:
					0 1px 2px rgba(21, 26, 33, 0.05),
					0 18px 44px -14px rgba(21, 26, 33, 0.2);
			}
			.b-card.flippable::before {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: 22px;
				background: var(--surface);
				transform: rotate(-2.4deg) translateY(7px);
				z-index: -1;
				opacity: 0.85;
				box-shadow: 0 10px 24px -14px rgba(21, 26, 33, 0.16);
			}
			.b-stamp {
				position: absolute;

			.c-foot a {
				color: var(--ink);
				text-decoration: underline;
				text-underline-offset: 3px;
			}
			.screen[data-dir='c'] .statusbar,
			.screen[data-dir='c'] .homebar {
				color: #fff;
				background-color: transparent;
			}
			.screen[data-dir='c'] .homebar {
				background: #fff;
			}
			/* ---------- review fixes ---------- */
			.screen.phone .is-empty .a-num {
				font-size: 36px;
			}
			.a-lhead,
			.b-lrow {
				align-items: center;
			}
			.screen.phone .b-mini .av {
				display: none;
			}
			.screen.phone .tag {
				display: block;
				width: max-content;
				margin: 3px 0 0;
			}
			.b-stack > * {
				min-width: 0;
			}
		</style>
	</head>
	<body>
		<svg width="0" height="0" style="position: absolute" aria-hidden="true">
			<defs>
				<symbol id="i-copy" viewBox="0 0 24 24">
					<rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
					<path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
				</symbol>
				<symbol id="i-clipboard" viewBox="0 0 24 24">

					<path d="M12 3h.01" />

					<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
				</symbol>
				<symbol id="i-clock" viewBox="0 0 24 24">
					<circle cx="12" cy="12" r="10" />
					<polyline points="12 6 12 12 16 14" />
				</symbol>
				<symbol id="b-tg" viewBox="0 0 24 24">
					<path
						d="M21.5 3.5 2.9 10.6c-.9.3-.9 1.5 0 1.8l4.6 1.5 1.8 5.4c.3.8 1.3 1 1.8.3l2.4-2.9 4.6 3.4c.6.4 1.4.1 1.6-.6l3.2-14.4c.2-.9-.6-1.6-1.4-1.3Z"
					/>
				</symbol>
				<symbol id="b-wa" viewBox="0 0 24 24">
					<path
						d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.4A10 10 0 1 0 12 2Zm5.3 14c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .1-1.6-.1-.4-.1-.9-.3-1.5-.6a11 11 0 0 1-4.2-3.9c-.3-.5-.7-1.2-.7-2s.4-1.2.6-1.4c.2-.2.4-.3.6-.3h.5c.2 0 .4 0 .6.4l.7 1.7c.1.2 0 .4-.1.5l-.3.4c-.1.1-.3.3-.1.6.2.3.7 1.1 1.4 1.8.9.8 1.6 1 1.9 1.2.2.1.4 0 .5-.1l.6-.7c.2-.2.3-.2.6-.1l1.6.8c.3.1.4.2.5.3v.9Z"
					/>
				</symbol>
				<symbol id="b-sms" viewBox="0 0 24 24">
					<path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z" />
				</symbol>
			</defs>
		</svg>

		<div class="wrap">
			<header class="deck">
				<h1>textme — three identities, one flow</h1>
				<p class="thesis">
					Same states, same features, three looks. Paste a number, tap an app. Pick a direction;
					Round 2 expands it to every state.
				</p>
				<div class="controls">
					<div class="seg" id="dirs" role="group" aria-label="Direction"></div>
					<div class="seg" id="pager" role="group" aria-label="State"></div>
					<div class="seg" id="focus" role="group" aria-label="Device">
						<button type="button" data-focus="both" aria-pressed="true">Both</button>
						<button type="button" data-focus="phone" aria-pressed="false">Phone</button>
						<button type="button" data-focus="desk" aria-pressed="false">Desktop</button>
					</div>
					<span class="kbd"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> direction · <kbd>←</kbd><kbd>→</kbd> state</span>
				</div>
				<p id="note"></p>
			</header>

			<main class="stage" id="stage">
				<section class="lane phone" id="lane-phone">
					<div class="bezel">
						<div class="screen phone" id="screen-phone" data-lane="phone">
							<div class="island"></div>
							<div class="statusbar">
								<span>9:41</span>
								<span class="cell"><span>●●●●</span><span class="bat"><i></i></span></span>
							</div>
							<div id="app-phone"></div>
							<div class="homebar"></div>
						</div>
					</div>
				</section>
				<section class="lane desk" id="lane-desk">
					<div class="win">
						<div class="win-bar"><i></i><i></i><i></i><span class="win-url" id="url"></span></div>
						<div class="screen desk" id="screen-desk" data-lane="desk"><div id="app-desk"></div></div>
					</div>
				</section>
			</main>
		</div>

		<script>
			const DIRS = [
				{
					id: 'a',
					label: 'A · Dialpad',
					note: '<b>A · Dialpad.</b> The number is the headline: Archivo wide digits, hairline rows, a paste key. Warm white, signal orange. Rows keep the brand marks; everything else is caption.',
				},
				{
					id: 'b',
					label: 'B · Card',
					note: '<b>B · Card.</b> A number is a person, so it gets a card. Bricolage Grotesque + Hanken Grotesk on a cool slate ground, indigo accent, brand-colored pills. The card flips to show the QR (back card peeks behind).',
				},
				{
					id: 'c',
					label: 'C · Composer',
					note: '<b>C · Composer.</b> The first line of the chat, thumb-first, dark by default. Sora, coral sent bubble, brand reply chips. The composer stays at the bottom where the thumb is; the list is a thread.',
				},
			];
			const STATES = [
				{ id: 'empty', label: 'Empty', url: 'textme.cc' },
				{ id: 'valid', label: 'Valid number', url: 'textme.cc/34612345678' },
				{ id: 'list', label: 'List paste', url: 'textme.cc' },
				{ id: 'landing', label: 'Shared link', url: 'textme.cc/34612345678/Maria' },
			];
			const RECENT = [
				{ n: '+1 202 456 1111', who: '', when: '3d' },
				{ n: '+34 698 76 54 32', who: 'Luis', when: '1w' },
			];
			const CONTACTS = [
				{ name: 'Maria', num: '+34 612 34 56 78' },
				{ name: 'Luis', num: '+34 698 76 54 32' },
				{ name: 'Ana B', num: '+34 656 78 12 34' },
				{ name: 'Carlos', num: '+34 634 56 78 90' },
				{ name: 'Elena', num: '+34 678 90 12 34' },
				{ name: 'Pablo', num: '+34 655 12 34 56', inferred: true },
			];
			const PASTE_TEXT =
				'Maria 34612345678\nLuis 34698765432\nAna B 34656781234\n\nFriends:\nCarlos 34634567890\nElena 34678901234\nPablo 655 123 456';

			const ico = (n, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
			const brand = (n) => `<svg class="brand" aria-hidden="true"><use href="#b-${n}"/></svg>`;
			const rowActs = (cls) =>
				`<button class="${cls}" aria-label="Copy">${ico('copy')}</button>` +
				`<button class="${cls} tg" aria-label="Telegram">${brand('tg')}</button>` +
				`<button class="${cls} wa" aria-label="WhatsApp">${brand('wa')}</button>` +
				`<button class="${cls} sms" aria-label="SMS">${brand('sms')}</button>` +
				`<button class="${cls}" aria-label="Save contact">${ico('contact-round')}</button>`;

			/* ---------- A ---------- */
			function renderA(s) {
				const top = `<header class="a-top"><span class="a-brand">text<i>me</i></span></header>`;
				const cc = (note) =>
					`<div class="a-cc">🇪🇸 <span>+34</span>${note ? `<em>· ${note}</em>` : ''}</div>`;
				const rows = (ghost) =>
					`<nav class="a-rows${ghost ? ' ghost' : ''}">` +
					`<a class="a-row tg" href="#">${brand('tg')}<span>Telegram</span>${ico('chevron-right')}</a>` +
					`<a class="a-row wa" href="#">${brand('wa')}<span>WhatsApp</span>${ico('chevron-right')}</a>` +
					`<a class="a-row sms" href="#">${brand('sms')}<span>SMS</span>${ico('chevron-right')}</a></nav>`;
				const sec = (name) =>
					`<div class="a-sec"><button>${ico('contact-round')}${name ? `Save ${name}` : 'Save contact'}</button>` +
					`<button>${ico('share')}Share link</button><button>${ico('qr-code')}QR</button></div>`;
				const recent =
					`<section class="a-recent"><div class="a-label">Recent</div>` +
					RECENT.map(
						(r) =>
							`<div class="a-rrow"><span class="n">${r.n}</span>${r.who ? `<span class="who">${r.who}</span>` : ''}` +
							`<span class="when">${r.when}</span><button class="x" aria-label="Remove">${ico('x')}</button></div>`,
					).join('') +
					`</section>`;

				if (s.id === 'empty')
					return (
						top +
						`<section class="a-hero">${cc()}<div class="a-numline"><div class="a-num"><span class="a-caret"></span><span class="ph">612 34 56 78</span></div>` +
						`<button class="a-key">${ico('clipboard')}Paste</button></div></section>` +
						rows(true) +
						recent
					);
				if (s.id === 'valid')
					return (
						top +
						`<section class="a-hero">${cc()}<div class="a-numline"><div class="a-num">612 34 56 78</div>` +
						`<button class="a-iconbtn" aria-label="Copy +34 612 34 56 78">${ico('copy')}</button></div></section>` +
						rows(false) +
						sec()
					);
				if (s.id === 'landing')
					return (
						top +
						`<section class="a-hero"><div class="a-name">Maria</div>${cc()}<div class="a-numline"><div class="a-num sm">612 34 56 78</div>` +
						`<button class="a-iconbtn" aria-label="Copy">${ico('copy')}</button></div></section>` +
						rows(false) +
						sec('Maria') +
						`<footer class="a-foot">Shared with textme · <a href="#">Make your own link</a></footer>`
					);
				return (
					top +
					`<section class="a-hero">${cc('applied to bare numbers')}<pre class="a-paste">${PASTE_TEXT}</pre></section>` +
					`<section class="a-list"><div class="a-lhead"><span class="a-count">6 contacts</span><span class="a-note">1 number got +34</span><button class="a-btn ghost">Clear</button></div>` +
					`<div class="a-lbtns"><button class="a-btn primary">${ico('download')}Download all .vcf</button><button class="a-btn">${ico('copy')}Copy all</button></div>` +
					`<div class="a-crows">` +
					CONTACTS.map(
						(c) =>
							`<div class="a-crow"><div class="who"><b>${c.name}</b><span class="n">${c.num}${c.inferred ? '<i class="tag">+34 added</i>' : ''}</span></div>` +
							`<div class="acts">${rowActs('')}</div></div>`,
					).join('') +
					`</div></section>`
				);
			}

			/* ---------- B ---------- */
			function renderB(s) {
				const top = `<header class="b-top"><span class="b-brand b-display">text<i>me</i></span></header>`;
				const stamp = `<button class="b-stamp" aria-label="Country: Spain">🇪🇸 +34</button>`;
				const pills =
					`<div class="b-pills"><a class="b-pill tg b-display" href="#">${brand('tg')}Telegram</a>` +
					`<a class="b-pill wa b-display" href="#">${brand('wa')}WhatsApp</a>` +
					`<a class="b-pill sms b-display" href="#">${brand('sms')}SMS</a></div>`;
				const foot = (name) =>
					`<div class="b-foot"><button>${ico('contact-round')}${name ? `Save ${name}` : 'Save contact'}</button>` +
					`<button>${ico('share')}Share link</button><button>${ico('qr-code')}QR</button></div>`;
				const recent =
					`<div class="b-recent"><span class="lbl">Recent</span>` +
					RECENT.map(
						(r) =>
							`<span class="b-chip">${r.n}${r.who ? `<span class="who">${r.who}</span>` : ''}<button class="x" aria-label="Remove">${ico('x')}</button></span>`,
					).join('') +
					`</div>`;

				if (s.id === 'empty')
					return (
						top +
						`<div class="b-scene"><div class="b-card">${stamp}<div class="b-kicker">Phone number</div>` +
						`<div class="b-title b-display ph"><span class="caret"></span>612 34 56 78</div>` +
						`<button class="b-paste">${ico('clipboard')}Paste number</button>` +
						`<div class="b-hint">or type it · paste a whole list to save them all</div></div>${recent}</div>`
					);
				if (s.id === 'valid')
					return (
						top +
						`<div class="b-scene"><div class="b-card flippable">${stamp}<div class="b-kicker">Phone number</div>` +
						`<div class="b-title b-display">612 34 56 78</div>` +
						`<div class="b-intl">+34 612 34 56 78<button aria-label="Copy">${ico('copy')}</button></div>` +
						pills +
						foot() +
						`</div></div>`
					);
				if (s.id === 'landing')
					return (
						top +
						`<div class="b-scene"><div class="b-card flippable b-landing">${stamp}<div class="b-avatar b-display">M</div>` +
						`<div class="b-name b-display">Maria</div><div class="b-title b-display">+34 612 34 56 78</div>` +
						pills +
						foot('Maria') +
						`</div></div><footer class="b-tail">Shared with textme · <a href="#">Make your own link</a></footer>`
					);
				return (
					top +
					`<div class="b-scene"><div class="b-card">${stamp}<div class="b-kicker">Pasted list</div><pre class="b-pre">${PASTE_TEXT}</pre>` +
					`<div class="b-lrow"><span class="b-count b-display">6 contacts</span><span class="b-note">1 number got +34</span><button class="b-btn ghost">Clear</button></div>` +
					`<div class="b-btns"><button class="b-btn primary">${ico('download')}Download all .vcf</button><button class="b-btn">${ico('copy')}Copy all</button></div></div>` +
					`<div class="b-stack">` +
					CONTACTS.map(
						(c) =>
							`<div class="b-mini"><span class="av b-display">${c.name[0]}</span><div class="who"><b>${c.name}</b><span>${c.num}${c.inferred ? '<i class="tag">+34 added</i>' : ''}</span></div>` +
							`<div class="acts">${rowActs('')}</div></div>`,
					).join('') +
					`</div></div>`
				);
			}

			/* ---------- C ---------- */
			function renderC(s) {
				const top = (peer) =>
					`<header class="c-top">${peer ? `<span class="c-peer"><span class="av">M</span>Maria</span>` : `<span class="c-brand">text<i>me</i></span>`}</header>`;
				const chips = (name, left) =>
					`<div class="c-chips${left ? ' left' : ''}"><a class="c-chip tg" href="#">${brand('tg')}Telegram</a>` +
					`<a class="c-chip wa" href="#">${brand('wa')}WhatsApp</a><a class="c-chip sms" href="#">${brand('sms')}SMS</a>` +
					`<button class="c-chip">${ico('contact-round')}${name ? `Save ${name}` : 'Save contact'}</button>` +
					`<button class="c-chip">${ico('share')}Share link</button><button class="c-chip">${ico('qr-code')}QR</button></div>`;
				const composer = (mode) => {
					const field = {
						empty: `<div class="c-field ph"><span class="caret"></span>612 34 56 78</div><button class="c-paste">${ico('clipboard')}Paste</button>`,
						valid: `<div class="c-field">612 34 56 78</div><button class="c-clear" aria-label="Clear">${ico('x')}</button>`,
						list: `<div class="c-field multi">${PASTE_TEXT}</div><button class="c-clear" aria-label="Clear">${ico('x')}</button>`,
						landing: `<div class="c-field ph">Try your own number</div><button class="c-paste">${ico('clipboard')}Paste</button>`,
					}[mode];
					return `<footer class="c-composer"><button class="c-flag" aria-label="Country: Spain">🇪🇸</button>${field}</footer>`;
				};

				if (s.id === 'empty')
					return (
						top() +
						`<main class="c-thread"><div class="c-hint">Paste a number, or pick one you used recently</div><div class="c-recent">` +
						RECENT.map(
							(r) =>
								`<span class="c-rchip">${ico('clock')}${r.n}${r.who ? `<span class="who">${r.who}</span>` : ''}<span class="when">${r.when}</span><button class="x" aria-label="Remove">${ico('x')}</button></span>`,
						).join('') +
						`</div></main>` +
						composer('empty')
					);
				if (s.id === 'valid')
					return (
						top() +
						`<main class="c-thread"><div class="c-bubble sent">+34 612 34 56 78<button class="cp" aria-label="Copy">${ico('copy')}</button></div>${chips()}</main>` +
						composer('valid')
					);
				if (s.id === 'landing')
					return (
						top(true) +
						`<main class="c-thread"><div class="c-bubble recv big">+34 612 34 56 78<button class="cp" aria-label="Copy">${ico('copy')}</button></div>${chips('Maria', true)}` +
						`<div class="c-foot">Shared with textme · <a href="#">Make your own link</a></div></main>` +
						composer('landing')
					);
				return (
					top() +
					`<main class="c-thread"><div class="c-hint">6 contacts · 1 number got +34 🇪🇸</div>` +
					CONTACTS.map(
						(c) =>
							`<div class="c-bubble recv contact"><div class="who"><b>${c.name}</b><span>${c.num}${c.inferred ? '<i class="tag">+34 added</i>' : ''}</span></div>` +
							`<div class="c-mini">${rowActs('')}</div></div>`,
					).join('') +
					`</main><div class="c-bar"><button class="primary">${ico('download')}Download 6 contacts</button><button class="ghost">Copy all</button></div>` +
					composer('list')
				);
			}

			const BUILD = { a: renderA, b: renderB, c: renderC };
			window.DECK = { variants: DIRS.map((d) => d.id), states: STATES.map((s) => s.id) };

			/* ---------- shell ---------- */
			const dirsEl = document.getElementById('dirs');
			const pagerEl = document.getElementById('pager');
			const noteEl = document.getElementById('note');
			const urlEl = document.getElementById('url');
			const screens = {
				phone: document.getElementById('screen-phone'),
				desk: document.getElementById('screen-desk'),
			};
			const apps = {
				phone: document.getElementById('app-phone'),
				desk: document.getElementById('app-desk'),
			};
			let dir = 'a';
			let state = 'empty';

			DIRS.forEach((d) => {
				const b = document.createElement('button');
				b.type = 'button';
				b.textContent = d.label;
				b.dataset.variant = d.id;
				b.addEventListener('click', () => select(d.id, state, true));
				dirsEl.appendChild(b);
			});
			STATES.forEach((s) => {
				const b = document.createElement('button');
				b.type = 'button';
				b.textContent = s.label;
				b.dataset.set = s.id;
				b.addEventListener('click', () => select(dir, s.id, true));
				pagerEl.appendChild(b);
			});

			function render() {
				const s = STATES.find((x) => x.id === state);
				const d = DIRS.find((x) => x.id === dir);
				for (const lane of ['phone', 'desk']) {
					screens[lane].dataset.dir = dir;
					apps[lane].outerHTML = `<div id="app-${lane}" class="app ${dir} is-${state}">${BUILD[dir](s, lane)}</div>`;
					apps[lane] = document.getElementById(`app-${lane}`);
				}
				urlEl.textContent = s.url;
				noteEl.innerHTML = d.note;
				dirsEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.variant === dir)));
				pagerEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.set === state)));
			}

			function select(d, s, push) {
				if (!BUILD[d] || !STATES.some((x) => x.id === s)) return;
				dir = d;
				state = s;
				if (push) history.replaceState(null, '', `#${d}/${s}`);
				render();
			}

			const focusBar = document.getElementById('focus');
			focusBar.addEventListener('click', (e) => {
				const btn = e.target.closest('button');
				if (!btn) return;
				const mode = btn.dataset.focus;
				focusBar.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
				document.getElementById('lane-phone').hidden = mode === 'desk';
				document.getElementById('lane-desk').hidden = mode === 'phone';
			});

			addEventListener('keydown', (e) => {
				if (e.target.matches('input, textarea')) return;
				const di = DIRS.findIndex((x) => x.id === dir);
				const si = STATES.findIndex((x) => x.id === state);
				if (e.key === 'ArrowRight') select(dir, STATES[(si + 1) % STATES.length].id, true);
				else if (e.key === 'ArrowLeft') select(dir, STATES[(si + STATES.length - 1) % STATES.length].id, true);
				else if (e.key === '1' || e.key === '2' || e.key === '3') select(DIRS[Number(e.key) - 1].id, state, true);
			});

			function fromHash() {
				const [d, s] = location.hash.replace('#', '').split('/');
				if (BUILD[d] && STATES.some((x) => x.id === s)) select(d, s, false);
				else render();
			}
			addEventListener('hashchange', fromHash);
			fromHash();
		</script>
	</body>
</html>
