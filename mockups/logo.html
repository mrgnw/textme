<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>textme — wordmark options</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="card.css" />
		<style>
			/* ---------- proposed theme tokens (the future app.css :root / .dark) ---------- */
			.screen {
				--background: 216 25% 95%;
				--foreground: 215 25% 11%;
				--card: 0 0% 100%;
				--card-foreground: 215 25% 11%;
				--popover: 0 0% 100%;
				--popover-foreground: 215 25% 11%;
				--muted: 214 24% 92%;
				--muted-foreground: 215 19% 35%;
				--accent: 214 24% 92%;
				--accent-foreground: 215 25% 11%;
				--secondary: 214 24% 92%;
				--secondary-foreground: 215 25% 11%;
				--border: 214 20% 86%;
				--input: 214 20% 80%;
				--primary: 240 55% 55%;
				--primary-foreground: 0 0% 100%;
				--destructive: 0 65% 45%;
				--destructive-foreground: 0 0% 100%;
				--ring: 240 55% 55%;
				--radius: 0.75rem;
				--telegram: 208 100% 50%;
				--telegram-foreground: 0 0% 100%;
				--whatsapp: 169 100% 25%;
				--whatsapp-foreground: 0 0% 100%;
				--sms: 266 87% 61%;
				--sms-foreground: 0 0% 100%;
			}
			.screen.dark {
				--background: 220 20% 8%;
				--foreground: 210 20% 96%;
				--card: 220 18% 12%;
				--card-foreground: 210 20% 96%;
				--popover: 220 18% 12%;
				--popover-foreground: 210 20% 96%;
				--muted: 220 15% 17%;
				--muted-foreground: 215 15% 70%;
				--accent: 220 15% 17%;
				--accent-foreground: 210 20% 96%;
				--secondary: 220 15% 17%;
				--secondary-foreground: 210 20% 96%;
				--border: 220 14% 20%;
				--input: 220 14% 26%;
				--primary: 240 70% 74%;
				--primary-foreground: 240 30% 12%;
				--destructive: 0 70% 62%;
				--destructive-foreground: 0 0% 100%;
				--ring: 240 70% 74%;
				--telegram: 216 92% 61%;
				--telegram-foreground: 0 0% 100%;
				--whatsapp: 142 70% 49%;
				--whatsapp-foreground: 220 20% 8%;
				--sms: 266 87% 61%;
				--sms-foreground: 0 0% 100%;
			}
			.font-display {
				font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
				font-optical-sizing: auto;
			}
			.screen {
				background: hsl(var(--background));
				color: hsl(var(--foreground));
				border-radius: 12px;
				padding: 0 0 20px;
				-webkit-font-smoothing: antialiased;
			}
			.wm {
				font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
				font-optical-sizing: auto;
				font-weight: 700;
				letter-spacing: -0.02em;
				line-height: 1;
				display: inline-flex;
				align-items: center;
				white-space: nowrap;
			}
			.bubble {
				display: inline-block;
				position: relative;
				padding: 0.12em 0.34em 0.14em;
				border-radius: 0.7em;
				background: hsl(var(--primary));
				color: hsl(var(--primary-foreground));
			}
			.bubble::after {
				content: '';
				position: absolute;
				left: 0.22em;
				bottom: -0.2em;
				width: 0.34em;
				height: 0.34em;
				background: hsl(var(--primary));
				clip-path: polygon(0 0, 100% 0, 0 100%);
			}
			.caret {
				display: inline-block;
				width: 0.09em;
				height: 0.82em;
				margin-left: 0.06em;
				background: hsl(var(--primary));
				animation: blink 1.1s steps(2) infinite;
			}
			@keyframes blink {
				50% {
					opacity: 0;
				}
			}
			.mark {
				display: inline-block;
				width: 1em;
				height: 1em;
				flex: none;
			}
			.tile {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				border-radius: 22%;
				background: hsl(var(--primary));
				color: hsl(var(--primary-foreground));
				font-family: 'Bricolage Grotesque', sans-serif;
				font-weight: 800;
				letter-spacing: -0.04em;
			}
			:root {
				--shell-bg: #e9e8e4;
				--shell-ink: #1f1f1d;
				--shell-muted: #6d6c67;
				--shell-line: #d5d3cc;
			}
			body {
				background: var(--shell-bg);
				color: var(--shell-ink);
				font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
				margin: 0;
			}
			.wrap {
				padding: 20px 24px 64px;
				max-width: 1180px;
			}
			h1 {
				font-size: 15px;
				font-weight: 600;
				margin: 0 0 4px;
			}
			.thesis {
				color: var(--shell-muted);
				max-width: 70ch;
				margin: 0 0 22px;
			}
			.opt {
				display: grid;
				grid-template-columns: 200px 1fr 1fr;
				gap: 16px;
				align-items: stretch;
				margin-bottom: 18px;
			}
			.opt h2 {
				font-size: 14px;
				font-weight: 600;
				margin: 0 0 4px;
			}
			.opt p {
				color: var(--shell-muted);
				margin: 0;
				font-size: 13px;
			}
			.hdr {
				height: 56px;
				display: flex;
				align-items: center;
				justify-content: center;
				border-bottom: 1px solid hsl(var(--border));
				margin-bottom: 18px;
			}
			.hero {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 24px;
				gap: 16px;
			}
			.tiles {
				display: flex;
				align-items: center;
				gap: 10px;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<h1>textme — wordmark options</h1>
			<p class="thesis">
				Each option at header size (18px, in the card header) and hero size (40px), light and dark, with a 32px and 64px
				app-icon tile. All Bricolage Grotesque, the product's display face. A is today's mark.
			</p>
			<main id="opts"></main>
		</div>
		<script>
			const bubbleMark = `<svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="hsl(var(--primary))" d="M6 3h12a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4h-7l-5.2 4.2A.5.5 0 0 1 5 21.8V18a4 4 0 0 1-3-3.9V7a4 4 0 0 1 4-4Z"/><circle cx="8.5" cy="10.5" r="1.5" fill="hsl(var(--primary-foreground))"/><circle cx="12" cy="10.5" r="1.5" fill="hsl(var(--primary-foreground))"/><circle cx="15.5" cy="10.5" r="1.5" fill="hsl(var(--primary-foreground))"/></svg>`;
			const tileMark = `<svg viewBox="0 0 24 24" style="width:70%;height:70%" aria-hidden="true"><path fill="hsl(var(--primary-foreground))" d="M6 3h12a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4h-7l-5.2 4.2A.5.5 0 0 1 5 21.8V18a4 4 0 0 1-3-3.9V7a4 4 0 0 1 4-4Z"/><circle cx="8.5" cy="10.5" r="1.5" fill="hsl(var(--primary))"/><circle cx="12" cy="10.5" r="1.5" fill="hsl(var(--primary))"/><circle cx="15.5" cy="10.5" r="1.5" fill="hsl(var(--primary))"/></svg>`;
			const OPTIONS = [
				{ id: 'a', title: 'A · Today', note: 'Bold lowercase, “me” in the primary colour. Reads fine, but the colour split is the only idea and nothing survives as an icon.', wm: `text<span class="text-primary">me</span>`, tile: 'tm' },
				{ id: 'b', title: 'B · “me” in a bubble', note: 'The “me” sits in a sent-message bubble with a tail. The product is “text me”; the bubble is the noun. The bubble alone is the icon.', wm: `text<span class="bubble" style="margin-left:.14em">me</span>`, tile: 'me' },
				{ id: 'c', title: 'C · Bubble mark + wordmark', note: 'A typing-dots bubble as a separate mark, wordmark in one colour. Cleanest split between icon and name; the mark scales to favicon and app icon without letters.', wm: `${bubbleMark}<span style="margin-left:.3em">textme</span>`, tile: tileMark },
				{ id: 'd', title: 'D · “text me”, link cue', note: 'Two words, the imperative the product actually is, with “me” underlined in primary like a link. Ties to “everything here is a link”.', wm: `text<span class="text-primary" style="margin-left:.25em;text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.14em">me</span>`, tile: 't' },
				{ id: 'e', title: 'E · Caret', note: 'The wordmark with a blinking caret after it, the same caret the empty number field shows. Says “type here”. Motion in a logo is a risk in the header.', wm: `textme<span class="caret"></span>`, tile: 't|' },
				{ id: 'f', title: 'F · Weight contrast', note: 'One colour, “text” at 800 and “me” at 500. Quiet and typographic; nothing to turn into an icon.', wm: `<span style="font-weight:800">text</span><span style="font-weight:500">me</span>`, tile: 'tm' },
				{ id: 'g', title: 'G · Whole word as a message', note: 'The full wordmark inside a bubble, like a sent message. Strong as a badge, heavy in the header next to a card.', wm: `<span class="bubble">textme</span>`, tile: tileMark },
			];
			const tile = (opt, px) =>
				`<span class="tile" style="width:${px}px;height:${px}px;font-size:${px * 0.48}px">${opt.tile.length <= 2 ? opt.tile : opt.tile}</span>`;
			const screen = (opt, dark) =>
				`<div class="screen ${dark ? 'dark' : ''}">` +
				`<div class="hdr"><a class="wm" style="font-size:18px">${opt.wm}</a></div>` +
				`<div class="hero"><span class="wm" style="font-size:40px">${opt.wm}</span><span class="tiles">${tile(opt, 32)}${tile(opt, 64)}</span></div>` +
				`</div>`;
			document.getElementById('opts').innerHTML = OPTIONS.map(
				(o) => `<section class="opt" id="${o.id}"><div><h2>${o.title}</h2><p>${o.note}</p></div>${screen(o, false)}${screen(o, true)}</section>`,
			).join('');
		</script>
	</body>
</html>
